<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Memory Card Game</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #042820;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color: #fff;
    position: relative;
    overflow-x: hidden;
  }

  h1 {
    margin-top: 20px;
    font-size: 48px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
    font-family: 'Poppins', sans-serif;
    color: #ffffb4;
  }

  .guide {
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    color: #fff8b0;
    text-align: center;
    max-width: 600px;
    margin-top: 10px;
    line-height: 1.5;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  }

  .menu {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
  }

  button {
    font-family: 'Poppins', sans-serif;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #ffffb4;
    color: #042820;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    transition: all 0.3s ease, transform 0.2s ease;
  }

  button:hover {
    background: #042820;
    color: #ffffb4;
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  button:active {
    transform: translateY(0);
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
  }

  .game-container {
    display: grid;
    grid-template-columns: repeat(4, 100px);
    gap: 15px;
    margin-top: 30px;
  }

  .card {
    width: 100px;
    height: 150px;
    perspective: 1200px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card:hover {
    transform: scale(1.1) rotateZ(2deg);
    box-shadow: 0 0 25px #ffffb4, 0 12px 25px rgba(0,0,0,0.8);
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .card-front {
    background: #042820;
    box-shadow: 0 8px 15px rgba(0,0,0,0.7);
    border: 2px solid #ffffb4;
    transition: all 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card-front img {
    width: 80%;
    height: auto;
    object-fit: cover;
    border-radius: 8px;
  }

  .card-front:hover {
    transform: scale(1.08) rotateX(5deg);
    box-shadow: 0 0 25px #ffffb4, 0 12px 25px rgba(0,0,0,0.85);
  }

  .card-back {
    background: #ffffb4;
    transform: rotateY(180deg);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 15px rgba(0,0,0,0.5);
    border: 2px solid #042820;
    transition: all 0.3s ease, transform 0.3s ease;
  }

  .card-back img {
    width: 80%;
    height: auto;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.3s ease;
  }

  .card.matched {
    animation: matchedGlow 1.5s ease infinite alternate;
  }

  @keyframes matchedGlow {
    0% { box-shadow: 0 0 15px #ffffb4; }
    50% { box-shadow: 0 0 35px #ffffb4; }
    100% { box-shadow: 0 0 15px #ffffb4; }
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #ffffb4;
    border-radius: 50%;
    pointer-events: none;
    animation: particleAnim 0.8s ease forwards;
  }

  @keyframes particleAnim {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0.5); }
  }

  .footer-space { width: 100%; height: 80px; background: #042820; margin-top: 20px; }

  .congrats-page, .exit-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    color: #ffffb4;
    z-index: 2000;
    display: none;
    animation: fadeIn 0.5s ease forwards;
    background: rgba(4,40,32,0.95);
  }

  .congrats-buttons { display: flex; gap: 20px; margin-top: 20px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<h1>Cafe Memory Card Game</h1>
<div class="guide">
  How to play: Click on two cards to flip them. You can undo the first card if you want, but once the second card is selected, it locks in place. Match all pairs to win!
</div>

<div class="menu">
  <button onclick="restartGame()">Restart</button>
  <button onclick="exitGame()">Exit</button>
</div>

<div class="game-container" id="gameContainer"></div>
<div class="footer-space"></div>

<div class="congrats-page" id="congratsPage">
  🎉 Congratulations! You matched all the cards! 🎉
  <div class="congrats-buttons">
    <button onclick="restartGame()">Play Again</button>
    <button onclick="exitGame()">Exit</button>
  </div>
</div>

<div class="exit-screen" id="exitScreen">
  👋 Thanks for playing the Cafe Memory Game!
</div>

<script>
const cardImages = [
  { src: "../images/coffeeCup.png" },
  { src: "../images/coffeeBean.png" },
  { src: "../images/croissant.png" },
  { src: "../images/donut.png" },
  { src: "../images/cupcake.png" },
  { src: "../images/icedCoffee.png" },
  { src: "../images/chocolate.png" },
  { src: "../images/fruitPastries.png" }
];

let cards = [...cardImages, ...cardImages];
let flippedCards = [];
let matchedPairs = 0;

const gameContainer = document.getElementById("gameContainer");
const congratsPage = document.getElementById("congratsPage");
const exitScreen = document.getElementById("exitScreen");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function reorderCards(array) {
  const numCols = 4;
  const lastRow = array.slice(-numCols);
  const remaining = array.slice(0, -numCols);
  const firstHalf = lastRow.slice(0, 2);
  const secondHalf = lastRow.slice(2);
  return [...firstHalf, ...remaining, ...secondHalf];
}

function initGame() {
  gameContainer.innerHTML = "";
  matchedPairs = 0;
  flippedCards = [];
  cards = shuffle([...cardImages, ...cardImages]);
  cards = reorderCards(cards);

  cards.forEach(item => {
    const card = document.createElement("div");
    card.classList.add("card");
    card.dataset.image = item.src;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          <img src="../images/coffee.png" alt="Card Front">
        </div>
        <div class="card-back">
          <img src="${item.src}" alt="Card Back">
        </div>
      </div>
    `;
    gameContainer.appendChild(card);

    card.addEventListener("click", () => {
      if (card.classList.contains("matched")) return;

      if (flippedCards.length === 1 && flippedCards[0] === card) {
        card.classList.remove("flipped");
        flippedCards = [];
        return;
      }

      if (flippedCards.length < 2 && !card.classList.contains("flipped")) {
        card.classList.add("flipped");
        flippedCards.push(card);
        if (flippedCards.length === 2) setTimeout(checkMatch, 800);
      }
    });
  });
}

function spawnParticles(card) {
  for (let i = 0; i < 10; i++) {
    const p = document.createElement("div");
    p.classList.add("particle");
    const x = (Math.random() - 0.5) * 100 + "px";
    const y = (Math.random() - 0.5) * 100 + "px";
    p.style.setProperty("--x", x);
    p.style.setProperty("--y", y);
    card.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function checkMatch() {
  const [first, second] = flippedCards;
  if (first.dataset.image === second.dataset.image) {
    matchedPairs++;
    first.classList.add("matched");
    second.classList.add("matched");
    spawnParticles(first);
    spawnParticles(second);
  } else {
    first.classList.remove("flipped");
    second.classList.remove("flipped");
  }
  flippedCards = [];
  if (matchedPairs === cardImages.length) congratsPage.style.display = "flex";
}

function restartGame() {
  congratsPage.style.display = "none";
  exitScreen.style.display = "none";
  initGame();
  document.querySelector("h1").style.display = "block";
  gameContainer.style.display = "grid";
}

function exitGame() {
  congratsPage.style.display = "none";
  document.querySelector("h1").style.display = "none";
  gameContainer.style.display = "none";
  exitScreen.style.display = "flex";
}

initGame();
</script>
</body>
</html>
