<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game with Coupons</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  canvas {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 12px;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    width: 420px;
    gap: 10px;
  }

  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    background: rgba(255,255,255,0.2);
    color: white;
    backdrop-filter: blur(6px);
    transition: 0.3s;
  }

  button:hover {
    background: rgba(255,255,255,0.4);
  }

  .instructions {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    padding: 12px;
    border-radius: 10px;
    width: 400px;
    text-align: left;
    font-size: 14px;
    line-height: 1.4em;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">
    <button onclick="exitGame()">Exit</button>
    <span>Snake Game</span>
  </div>
  <div class="instructions">
    <b>Instructions:</b><br>
    - Press any <b>Arrow Key</b> to start the game.<br>
    - Use <b>Arrow Keys</b> to move the snake.<br>
    - Eat <b>coffee circles</b> to grow.<br>
    - Occasionally, a <b>coupon</b> appears (gold rectangle).<br>
    - Eating a coupon gives a random real-world benefit.<br>
    - Avoid hitting walls or yourself.
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gridSize = 20;
let snake = [{x: 160, y: 200}];
let dx = 0;
let dy = 0;
let food = getRandomFood();
let coupon = null;
let speed = 150;
let gameStarted = false;

const coupons = [
  "10% off your next coffee order ☕",
  "Buy 1 Get 1 Latte 🥛",
  "Free cookie with any drink 🍪",
  "20% off bakery items 🥐",
  "Free small coffee ☕"
];

function drawGame() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Draw snake
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? "white" : "rgba(255,255,255,0.6)";
    ctx.beginPath();
    ctx.roundRect(seg.x, seg.y, gridSize-2, gridSize-2, 4);
    ctx.fill();
  });

  // Draw food
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2.5, 0, Math.PI*2);
  ctx.fill();

  // Draw coupon
  if(coupon) {
    ctx.fillStyle = "gold";
    ctx.fillRect(coupon.x, coupon.y, gridSize, gridSize/2);
  }

  if(gameStarted) {
    moveSnake();

    // Eating food
    if(snake[0].x === food.x && snake[0].y === food.y) {
      snake.push({});
      food = getRandomFood();
      if(!coupon && Math.random() < 0.2) coupon = getRandomFood();
    }

    // Eating coupon
    if(coupon && snake[0].x === coupon.x && snake[0].y === coupon.y) {
      snake.push({});
      const reward = coupons[Math.floor(Math.random()*coupons.length)];
      alert("🎁 Coupon Collected: " + reward);
      coupon = null;
    }

    if(checkCollision()) resetGame();
  }
}

function moveSnake() {
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  snake.unshift(head);
  snake.pop();
}

function getRandomFood() {
  return {
    x: Math.floor(Math.random() * (canvas.width/gridSize)) * gridSize,
    y: Math.floor(Math.random() * (canvas.height/gridSize)) * gridSize
  };
}

function checkCollision() {
  const head = snake[0];
  return head.x <0 || head.x>=canvas.width || head.y<0 || head.y>=canvas.height ||
         snake.slice(1).some(seg => seg.x===head.x && seg.y===head.y);
}

function resetGame() {
  snake = [{x:160, y:200}];
  dx = 0;
  dy = 0;
  food = getRandomFood();
  coupon = null;
  gameStarted = false;
  alert("Game Over! Press any arrow key to start again.");
}

document.addEventListener("keydown", e => {
  if(!gameStarted) {
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) gameStarted = true;
  }

  if(e.key==="ArrowUp" && dy===0){dx=0; dy=-gridSize;}
  if(e.key==="ArrowDown" && dy===0){dx=0; dy=gridSize;}
  if(e.key==="ArrowLeft" && dx===0){dx=-gridSize; dy=0;}
  if(e.key==="ArrowRight" && dx===0){dx=gridSize; dy=0;}
});

function exitGame() {
  window.location.href = "GameCorner.html";
}

setInterval(drawGame, speed);
</script>
</body>
</html>
